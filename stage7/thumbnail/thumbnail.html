  el('circle', { cx: cx + look[0] * r - r * 0.17, cy: cy + look[1] * r - r * 0.2, r: r * 0.13, fill: '#fff' });

function face(x, y, kind, k) {

    for (const [tx, ty, ts] of [[x - dx - 6 * k, y + 30 * k, 1], [x - dx - 2 * k, y + 50 * k, 0.8], [x + dx + 5 * k, y + 34 * k, 0.9]])
      el('path', { d: `M${tx} ${ty - 9 * k * ts} Q${tx + 6 * k * ts} ${ty} ${tx} ${ty + 5 * k * ts} Q${tx - 6 * k * ts} ${ty} ${tx} ${ty - 9 * k * ts}Z`, fill: '#5fc3ff', stroke: '#1d6fa8', 'stroke-width': 1.5 });
    el('path', { d: `M${x - 12 * k} ${y + 44 * k} Q${x} ${y + 34 * k} ${x + 12 * k} ${y + 44 * k}`, fill: 'none', stroke: '#111', 'stroke-width': 4.5, 'stroke-linecap': 'round' });
  } else {
    const lid = (cx, cy, r) => `M${cx - r} ${cy - r} L${cx + r} ${cy - r} L${cx + r} ${cy + r * 0.05} L${cx - r} ${cy - r * 0.45}Z`;
    const lidR = (cx, cy, r) => `M${cx - r} ${cy - r} L${cx + r} ${cy - r} L${cx + r} ${cy - r * 0.45} L${cx - r} ${cy + r * 0.05}Z`;

  }
}

    el('rect', { x: ix - 13, y: iy - 4, width: 26, height: 20, rx: 4, fill: '#fff' }); el('circle', { cx: ix, cy: iy + 5, r: 3, fill: p.fill[1] }); }

// heavy wide rounded sans like the donor (Nunito 900); size shrinks only if the line is wider than maxW
function outlined(parts, x, y, size, font, stroke, sw, anchorCenter, maxW = 1200) {
