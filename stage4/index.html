<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEAVE vs MOVE TO - episode engine</title>
<style>
@font-face{font-family:"Lilita One";src:url(assets/fonts/lilita-one-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Nunito";src:url(assets/fonts/nunito-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:"Nunito";src:url(assets/fonts/nunito-latin-900-normal.woff2) format("woff2");font-weight:900}
:root{--bg:#0f1720;--fg:#e8eef4;--mut:#93a1b0;--btn:#22303f;--acc:#4f8cff}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 Nunito,system-ui,sans-serif}
#wrap{max-width:1920px;margin:0 auto;padding:12px}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#2bbfd0;border-radius:6px}
#bar{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
#bar button{background:var(--btn);color:var(--fg);border:0;border-radius:8px;padding:8px 14px;font:800 15px Nunito,sans-serif;cursor:pointer}
#bar button:hover{background:#2c3e52}
#bar input[type=range]{flex:1;min-width:200px}
#time{font-variant-numeric:tabular-nums;color:var(--mut);min-width:110px}
body.render #bar{display:none} body.render #wrap{padding:0;max-width:none} body.render canvas{border-radius:0;width:1920px}
#err{color:#ff8a8a;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="bar">
    <button id="play">Play</button><button id="replay">Replay</button>
    <input id="seek" type="range" min="0" max="10" step="0.0333" value="0">
    <button id="snd">Sound: off</button>
    <span id="time">0.00 / 10.00 s</span>
    <select id="tech"><option value="">Episode</option></select>
  </div>
  <div id="err"></div>
</div>
<script src="data/world.js"></script>
<script src="data/episode.js"></script>
<script>
"use strict";
// =====================================================================
// Engine: every pixel is a pure function of time t (drawFrame(t)).
// Facts/timing live in data/episode.js; geometry in data/world.js.
// =====================================================================
const E = window.EPISODE, WD = window.WORLD;
const CW = 1920, CH = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const RENDER = /render=1/.test(location.search);
if (RENDER) document.body.classList.add('render');
window.onerror = (m, s, l) => { document.getElementById('err').textContent += m + ' @' + l + '\n'; window.JS_ERRORS = (window.JS_ERRORS || []).concat(m); };

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, s) => a + (b - a) * s;
const smooth = s => { s = clamp(s); return s * s * (3 - 2 * s); };
const easeInOut = s => { s = clamp(s); return s < .5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2; };
const easeOut = s => 1 - Math.pow(1 - clamp(s), 3);
const spring = s => { s = clamp(s); if (s >= 1) return 1; return 1 - Math.exp(-6 * s) * Math.cos(11 * s); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- assets (all loaded before start) ----------
const IMG = {};
function loadImg(key, src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[key] = i; res(); }; i.onerror = () => rej(new Error('missing ' + src)); i.src = src; }); }
const flagKeys = new Set([...(E.subject ? [E.subject.flag] : []), ...E.stops.map(s => s.flag), ...(E.techChecks || []).map(s => s.flag)]);
const READY = (async () => {
  await Promise.all([
    ...[...flagKeys].map(k => loadImg('flag_' + k, 'assets/flags/' + k + '.svg')),
    loadImg('emblem', E.emblem || 'assets/theme_suitcase.png'),
    document.fonts.load('400 60px "Lilita One"'), document.fonts.load('900 30px Nunito'), document.fonts.load('800 30px Nunito')
  ]);
  init();
  return true;
})();
window.READY = READY;

// ---------- geometry ----------
const C = {}; // countries by id
let LAND_ALL;
function ringPath(p, r) { p.moveTo(r[0], r[1]); for (let i = 2; i < r.length; i += 2) p.lineTo(r[i], r[i + 1]); p.closePath(); }
function init() {
  LAND_ALL = new Path2D();
  for (const c of WD.countries) {
    const path = new Path2D();
    for (const poly of c.polys) for (const r of poly.r) ringPath(path, r);
    c.path = path;
    let b = [1e9, 1e9, -1e9, -1e9];
    for (const poly of c.polys) { b[0] = Math.min(b[0], poly.b[0]); b[1] = Math.min(b[1], poly.b[1]); b[2] = Math.max(b[2], poly.b[2]); b[3] = Math.max(b[3], poly.b[3]); }
    c.bbox = b;
    // flag placement groups: polygons near the main one share one rectangle; remote ones get their own
    const m = c.polys[c.main].b, mw = m[2] - m[0], mh = m[3] - m[1];
    const ex = [m[0] - mw * .25, m[1] - mh * .25, m[2] + mw * .25, m[3] + mh * .25];
    const core = [...m]; const groups = [];
    c.polys.forEach((p, i) => {
      const cx = (p.b[0] + p.b[2]) / 2, cy = (p.b[1] + p.b[3]) / 2;
      if (i === c.main || (cx > ex[0] && cx < ex[2] && cy > ex[1] && cy < ex[3])) { core[0] = Math.min(core[0], p.b[0]); core[1] = Math.min(core[1], p.b[1]); core[2] = Math.max(core[2], p.b[2]); core[3] = Math.max(core[3], p.b[3]); }
      else groups.push(p.b);
    });
    c.flagRects = [core, ...groups];
    c.nearBox = core;
    C[c.id] = c;
    LAND_ALL.addPath(path);
  }
  buildClouds();
}

// ---------- camera ----------
const TOP_UI = 150, BOT_UI = 40;
function overviewCam() {
  const z = Math.min((CW - 2 * 70) / WD.meta.W, (CH - TOP_UI - BOT_UI - 30) / WD.meta.H);
  const ay = TOP_UI + (CH - TOP_UI - BOT_UI) / 2;
  return { x: WD.meta.W / 2, y: WD.meta.H / 2 - (ay - CH / 2) / z, z };
}
function countryCam(id, opts = {}) {
  const b = opts.box || C[id].nearBox;
  const bw = b[2] - b[0], bh = b[3] - b[1];
  const availW = CW * (opts.wFrac || 0.5), availH = CH - 190 - 300;
  const z = Math.min(availW / bw, availH / bh, opts.zmax || 9);
  const ax = CW * 0.42, ay = 190 + availH / 2;
  return { x: (b[0] + b[2]) / 2 + (CW / 2 - ax) / z, y: (b[1] + b[3]) / 2 + (CH / 2 - ay) / z, z };
}
function flyCam(a, b, s, dip, plain) {  // plain: long hops move evenly instead of rushing ahead of the zoom
  const e = easeInOut(s);
  const lz = lerp(Math.log(a.z), Math.log(b.z), e) - (dip || 0) * Math.sin(Math.PI * e);
  const z = Math.exp(lz);
  // interpolate the screen-centre world point; weight by zoom so the motion feels linear on screen
  const w = (1 / z - 1 / a.z) / ((1 / b.z - 1 / a.z) || 1e-9);
  const k = !plain && Math.abs(b.z - a.z) / Math.max(a.z, b.z) > 0.15 ? clamp(isFinite(w) ? w : e) : e;
  return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z };
}
// shots come from episode data: each frames one country or a small group; the camera flies between shots
// and never returns to the overview after the intro. Drift after arrival settles within DRIFT_T seconds so
// region boundaries always sit on a still camera.
const DRIFT_T = 3.0, DRIFT_Z = 0.025;
function unionBox(ids, pad) {
  const b = [1e9, 1e9, -1e9, -1e9];
  for (const id of ids) { const n = C[id].nearBox; b[0] = Math.min(b[0], n[0]); b[1] = Math.min(b[1], n[1]); b[2] = Math.max(b[2], n[2]); b[3] = Math.max(b[3], n[3]); }
  const minW = 100, minH = 62, cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
  const w = Math.max(b[2] - b[0], minW) * (1 + (pad || 0.12)), h = Math.max(b[3] - b[1], minH) * (1 + (pad || 0.12));
  return [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2];
}
let CAMS = null;
function buildCams() {
  // span: frame only part of a long thin country around its label point (Chile), so it stays big enough for a face
  const spanBox = (id, [w, h]) => { const l = C[id].label; return [l[0] - w / 2, l[1] - h / 2, l[0] + w / 2, l[1] + h / 2]; };
  CAMS = { ov: overviewCam(), shots: E.shots.map(sh => sh.overview ? overviewCam() : countryCam(null, { box: sh.box || (sh.span ? spanBox(sh.ids[0], sh.span) : unionBox(sh.ids, sh.pad)), wFrac: sh.wFrac || 0.5, zmax: sh.zmax || 9 })) };
  E.shots.forEach((sh, i) => { sh.idx = i; });
  for (const st of E.stops) st.shotIdx = E.shots.findIndex(sh => sh.ids.includes(st.id));
  if (E.colorAfter) for (const st of E.stops) { const nx = E.shots[st.shotIdx + 1]; st.colorAt = nx ? nx.flyStart + 0.1 : null; }
}
const drift = (cam, t0, t) => ({ x: cam.x, y: cam.y, z: cam.z * (1 + DRIFT_Z * smooth((t - t0) / DRIFT_T)) });
function shotAt(t) { let k = -1; for (let i = 0; i < E.shots.length; i++) if (t >= E.shots[i].flyStart) k = i; return k; }
function camAt(t) {
  if (!CAMS) buildCams();
  const ov = CAMS.ov, SH = E.shots, K = CAMS.shots;
  const f0 = SH[0].flyStart;
  const ovAt = tt => ({ x: ov.x, y: ov.y, z: ov.z * (1 + 0.02 * smooth(tt / f0)) });
  if (t < f0) return ovAt(t);
  const i = shotAt(t);
  const from = i === 0 ? ovAt(f0) : drift(K[i - 1], SH[i - 1].arrive, SH[i].flyStart);
  if (t < SH[i].arrive) return flyCam(from, K[i], (t - SH[i].flyStart) / (SH[i].arrive - SH[i].flyStart), i === 0 ? 0 : (SH[i].dip != null ? SH[i].dip : 0.18), SH[i].dip != null);
  return drift(K[i], SH[i].arrive, t);
}
let CAM;
function setWorld() { ctx.setTransform(CAM.z, 0, 0, CAM.z, CW / 2 - CAM.x * CAM.z, CH / 2 - CAM.y * CAM.z); }
function setScreen() { ctx.setTransform(1, 0, 0, 1, 0, 0); }
const w2s = (x, y) => [CW / 2 + (x - CAM.x) * CAM.z, CH / 2 + (y - CAM.y) * CAM.z];
function viewBox(pad = 0) { const hw = CW / 2 / CAM.z, hh = CH / 2 / CAM.z; return [CAM.x - hw - pad, CAM.y - hh - pad, CAM.x + hw + pad, CAM.y + hh + pad]; }
const boxHit = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];

// ---------- state from time ----------
function stateAt(t) {
  const visited = [];
  for (const s of E.stops) if (t >= s.activate) visited.push(s);
  return { visited, current: visited[visited.length - 1] || null };
}

// ---------- clouds (world-space anchors, fixed at init) ----------
const CLOUD_SPR = [], CLOUDS = [];
function buildClouds() {
  const R = mulberry32(E.seed);
  for (let v = 0; v < 8; v++) {
    const w = 360, h = 220, cnv = document.createElement('canvas'); cnv.width = w; cnv.height = h;
    const g = cnv.getContext('2d');
    const blobs = []; const n = 6 + Math.floor(R() * 5);
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1) - .5; const rr = 34 + R() * 30 + (1 - Math.abs(u) * 2) * 26;
      blobs.push({ x: w / 2 + u * (170 + R() * 40) + (R() - .5) * 18, y: 138 - (1 - Math.abs(u) * 1.6) * 34 - R() * 16, r: rr });
    }
    const flatY = 158;
    const body = (dy, col, shrink) => { g.save(); g.beginPath(); g.rect(0, 0, w, flatY + dy); g.clip(); g.fillStyle = col; for (const b of blobs) { g.beginPath(); g.ellipse(b.x, b.y + dy, Math.max(4, b.r - shrink), Math.max(4, (b.r - shrink) * .86), 0, 0, 7); g.fill(); } g.restore(); };
    g.filter = 'blur(3px)';
    body(8, '#a9bfd0', 0);        // shaded base
    g.filter = 'blur(2px)';
    body(0, '#e9f2f8', 2);        // soft body
    g.filter = 'blur(4px)';
    g.globalAlpha = .95; body(-10, '#ffffff', 12); // bright tops
    g.globalAlpha = 1; g.filter = 'none';
    // shadow sprite
    const sh = document.createElement('canvas'); sh.width = w; sh.height = h; const sg = sh.getContext('2d');
    sg.filter = 'blur(10px)'; sg.drawImage(cnv, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = 'rgba(8,52,70,1)'; sg.fillRect(0, 0, w, h);
    CLOUD_SPR.push({ img: cnv, sh, w, h });
  }
  const n = 56; ctx.setTransform(1, 0, 0, 1, 0, 0);
  const onLand = (x, y) => ctx.isPointInPath(LAND_ALL, x, y, 'evenodd');
  for (let tries = 0; CLOUDS.length < n && tries < 4000; tries++) {
    const c = { x: 60 + R() * (WD.meta.W - 120), y: 80 + R() * (WD.meta.H - 160), s: 30 + R() * 26, v: Math.floor(R() * 8), ph: R() * 6.28, sp: .25 + R() * .35, flip: R() < .5 };
    const hw = c.s * 1.25 + 14, hh = c.s * .75 + 14; let ok = true;
    for (let gx = -1; gx <= 1 && ok; gx += .5) for (let gy = -1; gy <= 1 && ok; gy += .5) if (onLand(c.x + gx * hw, c.y + gy * hh)) ok = false;
    if (ok) CLOUDS.push(c);
  }
}
function drawClouds(t, avoid, avoidBoxes) {
  const vb = viewBox(200);
  for (const c of CLOUDS) {
    if (c.x < vb[0] || c.x > vb[2] || c.y < vb[1] || c.y > vb[3]) continue;
    const spr = CLOUD_SPR[c.v];
    const breathe = 1 + 0.035 * Math.sin(t * c.sp * 2 + c.ph);
    const wx = c.x + 4 * Math.sin(t * c.sp + c.ph), wy = c.y + 1.5 * Math.sin(t * c.sp * 1.3 + c.ph);
    const ww = c.s * 2.2 * breathe, hh = ww * spr.h / spr.w;
    const [sx, sy] = w2s(wx, wy); const sw = ww * CAM.z, sh = hh * CAM.z;
    let a = 0.92;
    for (const o of avoid) { const d = Math.hypot(sx - o.x, sy - o.y); a *= clamp((d - o.r - sw * .25) / (sw * .45 + 40)); }
    for (const b of (avoidBoxes || [])) { const dx = Math.max(b[0] - sx, 0, sx - b[2]), dy = Math.max(b[1] - sy, 0, sy - b[3]); a *= clamp(Math.hypot(dx, dy) / (sw * .5 + 20)); }
    if (a < 0.02) continue;
    setScreen();
    ctx.globalAlpha = a * .32;
    ctx.save(); if (c.flip) { ctx.translate(sx, 0); ctx.scale(-1, 1); ctx.translate(-sx, 0); }
    ctx.drawImage(spr.sh, sx - sw / 2 + sw * .10, sy - sh / 2 + sh * .22, sw, sh);
    ctx.globalAlpha = a;
    ctx.drawImage(spr.img, sx - sw / 2, sy - sh / 2, sw, sh);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---------- map ----------
function drawSea() {
  setScreen();
  const g = ctx.createLinearGradient(0, 0, 0, CH); g.addColorStop(0, '#46d6d9'); g.addColorStop(1, '#1fa7bd');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  const r = ctx.createRadialGradient(CW * .45, CH * .45, 50, CW * .45, CH * .45, CW * .75);
  r.addColorStop(0, 'rgba(255,255,255,.16)'); r.addColorStop(1, 'rgba(0,40,70,.18)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, CW, CH);
}
let FLAG_STRETCH = null;
function flagFill(c, key, t0, t, origin, fit) {
  if (!FLAG_STRETCH) FLAG_STRETCH = new Set(E.stops.filter(s => s.flagFit === 'stretch').map(s => s.flag));
  const img = IMG['flag_' + key]; if (!img) return;
  const fa = img.naturalWidth / img.naturalHeight;
  const p = t0 == null ? 1 : clamp((t - t0) / 0.6);
  if (p <= 0) return;
  ctx.save();
  ctx.clip(c.path, 'evenodd');
  let R = 0;
  if (p < 1) {
    for (const b of c.flagRects) for (const [x, y] of [[b[0], b[1]], [b[2], b[1]], [b[0], b[3]], [b[2], b[3]]]) R = Math.max(R, Math.hypot(x - origin[0], y - origin[1]));
    ctx.beginPath(); ctx.arc(origin[0], origin[1], Math.max(0.01, easeOut(p) * R * 1.02), 0, 7); ctx.clip();
  }
  for (const b of c.flagRects) {
    const bw = b[2] - b[0], bh = b[3] - b[1];
    let w = bw, h = bw / fa; if (h < bh) { h = bh; w = bh * fa; }
    if (fit === 'stretch' || (fit !== 'strict' && FLAG_STRETCH.has(key))) { w = bw; h = bh; } // very wide countries with plain stripes (Russia): keep every stripe
    ctx.drawImage(img, (b[0] + b[2]) / 2 - w / 2, (b[1] + b[3]) / 2 - h / 2, w, h);
  }
  // keep a little volume on coloured countries
  const vb = c.nearBox; const g = ctx.createLinearGradient(0, vb[1], 0, vb[3]);
  g.addColorStop(0, 'rgba(255,255,255,.16)'); g.addColorStop(.55, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.14)');
  ctx.fillStyle = g; ctx.fill(c.path, 'evenodd');
  ctx.restore();
  if (p < 1) { // bright wavefront ring
    ctx.save(); ctx.clip(c.path, 'evenodd');
    ctx.strokeStyle = `rgba(255,255,235,${0.85 * (1 - p)})`; ctx.lineWidth = 7 / CAM.z;
    ctx.beginPath(); ctx.arc(origin[0], origin[1], easeOut(p) * R * 1.02, 0, 7); ctx.stroke(); ctx.restore();
  }
}
// After the camera leaves a shot its countries fade from flag to their status colour, so the world map
// slowly becomes the answer (green = people want in, red = people want out). Estimates get white hatching.
function statusTint(c, s, t) {
  const S = E.statuses[s.status]; if (!S) return;
  const k = s.colorAt != null ? clamp((t - s.colorAt) / 0.8) : (s.tint || 0);
  ctx.save(); ctx.clip(c.path, 'evenodd');
  if (k > 0) {   // radial wipe from the face point (an alpha crossfade of red into green turns muddy brown)
    const vb = c.nearBox; const g = ctx.createLinearGradient(0, vb[1], 0, vb[3]);
    g.addColorStop(0, S.color); g.addColorStop(1, S.dark);
    if (k < 1) {
      let R = 0; const o = c.label; for (const b of c.flagRects) for (const [x, y] of [[b[0], b[1]], [b[2], b[1]], [b[0], b[3]], [b[2], b[3]]]) R = Math.max(R, Math.hypot(x - o[0], y - o[1]));
      ctx.beginPath(); ctx.arc(o[0], o[1], Math.max(0.01, easeInOut(k) * R * 1.02), 0, 7); ctx.clip();
    }
    ctx.globalAlpha = 0.94; ctx.fillStyle = g; ctx.fill(c.path, 'evenodd'); ctx.globalAlpha = 1;
  }
  ctx.restore(); ctx.save(); ctx.clip(c.path, 'evenodd');
  if (s.quality === 'E') {
    const a = s.activate != null ? clamp((t - s.activate - 0.3) / 0.4) : 1;
    if (a > 0) {
      const b = c.bbox, step = 16 / CAM.z; ctx.strokeStyle = `rgba(255,255,255,${0.55 * a})`; ctx.lineWidth = 5 / CAM.z; ctx.beginPath();
      for (let x = b[0] - (b[3] - b[1]); x < b[2]; x += step) { ctx.moveTo(x, b[3]); ctx.lineTo(x + (b[3] - b[1]), b[1]); }
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawMap(t, st, forced) {
  drawSea();
  setWorld();
  const z = CAM.z, vb = viewBox(40 / z);
  const vis = WD.countries.filter(c => boxHit(c.bbox, vb));
  const vp = new Path2D(); for (const c of vis) vp.addPath(c.path);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // shallow-water glow around coasts
  ctx.strokeStyle = 'rgba(200,255,248,.30)'; ctx.lineWidth = 18 / z; ctx.stroke(vp);
  ctx.strokeStyle = 'rgba(220,255,250,.35)'; ctx.lineWidth = 7 / z; ctx.stroke(vp);
  // soft drop shadow
  const side = clamp(4 + 2.2 * Math.log2(z / CAMS.ov.z), 4, 10);
  ctx.save(); ctx.filter = 'blur(6px)'; ctx.translate(5 / z, (side + 8) / z); ctx.fillStyle = 'rgba(6,58,78,.30)'; ctx.fill(vp); ctx.restore();
  // extruded side
  ctx.save(); ctx.translate(0, side / z); ctx.fillStyle = '#7c8f3a'; ctx.fill(vp); ctx.strokeStyle = '#6f8233'; ctx.lineWidth = 1.5 / z; ctx.stroke(vp); ctx.restore();
  // top surface
  const g = ctx.createLinearGradient(0, vb[1], 0, vb[3]); g.addColorStop(0, '#f1f6b4'); g.addColorStop(1, '#d3e68e');
  ctx.fillStyle = g; ctx.fill(vp);
  // subject (USA) and visited countries keep flag colours
  const subj = E.subject ? C[E.subject.id] : null; if (subj && boxHit(subj.bbox, vb)) flagFill(subj, E.subject.flag, null, t);
  for (const s of st.visited) { const c = C[s.id]; if (boxHit(c.bbox, vb)) { flagFill(c, s.flag, s.activate, t, c.label, s.flagFit); statusTint(c, s, t); } }
  if (forced) for (const f of forced) { flagFill(C[f.id], f.flag, null, t, null, f.flagFit); statusTint(C[f.id], f, t); }
  // bright rim + crisp borders

// ---------- intro: theme emblem (suitcase) + LEAVE vs MOVE TO title ----------

// ---------- HUD ----------
function counts(st) { const n = {}; for (const k in E.statuses) n[k] = 0; for (const s of st.visited) n[s.status]++; return n; }

function drawHUD(t, st) {

  const cardW = 96 * keys.length + 26, x0 = 34, y0 = 26;
  glossyPanel(x0, y0, cardW, 122, 26, '#ffffff', '#e4ebf2', 'rgba(20,35,50,.45)');
  keys.forEach((k, i) => {
    const cx = x0 + 22 + i * 96 + 36, cy = y0 + 42;

  });

  const tcA = lastChange(t, () => true); const pPrev = Math.max(0, done - 1) / total, pNow = done / total;
  const pf = done ? lerp(pPrev, pNow, easeOut((t - tcA) / 0.6)) : 0;
  const px = CW - 34 - 600, py = 26, pw = 600, ph = 122;
  glossyPanel(px, py, pw, ph, 26, '#ffffff', '#e4ebf2', 'rgba(20,35,50,.45)');

  const bump = t - tcA < 0.5 ? 1 + 0.18 * Math.sin(clamp((t - tcA) / .5) * Math.PI) : 1;
  ctx.save(); ctx.translate(px + pw - 26, py + 42); ctx.scale(bump, bump);
  outlined(`${done} / ${total}`, 0, 0, '400 40px "Lilita One"', '#16212c', null, 0, 'right'); ctx.restore();
  outlined(`${Math.round(pf * 100)}%`, px + 118, py + 38, '400 32px "Lilita One"', '#4a5fd8', null, 0);
  const bx = px + 24, by = py + 68, bw = pw - 48, bh = 30;

    const fw = (bw - 6) * pf; const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0); gg.addColorStop(0, '#59c8ff'); gg.addColorStop(1, '#8b6bff');

  if (lines.length === 1) outlined(lines[0], nx, y + 24 + size * .82, `400 ${size}px "Lilita One"`, '#ffffff', 'rgba(0,0,0,.5)', 6);

    ctx.restore(); ctx.save(); ctx.setLineDash(QB[1] ? [] : [6, 5]); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2.5; rr(qx, qy, qw, 32, 16); ctx.stroke(); ctx.restore();

function drawRecent(t, st) {

    const fw = drawFlag(s.flag, xs + 16, y + 13, 32, 2);
    const rtag = s.rtag || s.tag; ctx.font = '800 20px Nunito'; const tagW = ctx.measureText(rtag).width;
    const room = rw - (30 + fw) - 62 - tagW - 14; let fs = 27; ctx.font = `900 ${fs}px Nunito`;

}

// ---------- final count (SC059) and the two maps (SC060); every time comes from a spoken word ----------
const O = E.outro || null;

}
function drawScoreboard(t, st) {

    outlined(OUT_LABEL[r.status], 142, 9, '900 22px Nunito', '#18222d', null, 0);

}
function pollColor(v) { return v >= 50 ? '#2FA05A' : v >= 35 ? '#8C96A3' : '#E0283B'; }
function miniMap(px, py, pw, ph, mode) {
  const W = WD.meta.W, H = WD.meta.H, z = Math.min((pw - 40) / W, (ph - 150) / H);
  const ox = px + pw / 2 - W / 2 * z, oy = py + 74 + (ph - 150) / 2 - H / 2 * z;
  ctx.save(); ctx.setTransform(z, 0, 0, z, ox, oy);
  ctx.fillStyle = '#e6ecc9'; ctx.fill(LAND_ALL);

  else for (const p of O.polls) { ctx.fillStyle = pollColor(p.v); ctx.fill(C[p.id].path, 'evenodd'); }

  ctx.strokeStyle = 'rgba(40,60,40,.55)'; ctx.lineWidth = 0.9 / z; ctx.stroke(LAND_ALL);

}
function legend(items, x, y) {

  let cx = x - w / 2;
  for (const [col, txt] of items) { rr(cx, y - 11, 22, 22, 6); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.stroke();
    outlined(txt, cx + 30, y + 7, '900 19px Nunito', '#3a4652', null, 0); cx += ctx.measureText(txt).width + 54; }

function drawSplit(t) {

    [[S.ALLY.color, 'TREATY'], [S.PARTNER.color, 'PARTNER'], [S.NORMAL.color, 'NORMAL'], [S.FRICTION.color, 'FRICTION'], [S.HOSTILE.color, 'HOSTILE']], -500);
  const R = panel(980, O.right, 'IN THE POLLS: PEW 2026', 'poll',
    [['#2FA05A', '50%+'], ['#8C96A3', '35-49%'], ['#E0283B', 'UNDER 35%'], ['#e6ecc9', 'NOT SURVEYED']], 500);

    outlined('WHICH NUMBER SURPRISED YOU MOST?', 0, 26, '400 70px "Lilita One"', '#ffffff', 'rgba(0,0,0,.5)', 8, 'center'); ctx.restore(); }
}
function drawOutroUI(t, st) {

  if (t >= O.left) drawSplit(t);
}

// ---------- frame ----------
function tagAlpha(stop, t) { // the name tag belongs to the newest country of the current shot
  const i = E.stops.indexOf(stop), nx = E.stops[i + 1];
  const a = clamp((t - stop.activate - 0.25) / 0.3);
  const endT = nx ? nx.activate : evEndShot(stop);
  return a * (1 - clamp((t - endT) / 0.3));
}
function drawFrame(t) {
  t = clamp(t, 0, E.duration);
  CAM = camAt(t);
  const st = stateAt(t);
  ctx.save();
  drawMap(t, st);
  setScreen();
  const avoid = [];
  const vis = st.visited.map(s => ({ s, c: C[s.id], f: faceGeom(C[s.id]), mi: microInfo(s) }))
    .filter(o => !(o.f.x < -200 || o.f.x > CW + 200 || o.f.y < -200 || o.f.y > CH + 200));
  for (const o of vis) avoid.push({ x: o.f.x, y: o.f.y, r: Math.max(o.f.R, 30) * 1.4 });
  const boxes = [];
  if (st.current) { const b = C[st.current.id].nearBox; const p0 = w2s(b[0], b[1]), p1 = w2s(b[2], b[3]); boxes.push([p0[0], p0[1], p1[0], p1[1]]); }
  boxes.push([34, 26, 34 + 96 * 6 + 26, 148], [CW - 634, 26, CW - 34, 148], [34, CH - 210, 34 + 760, CH - 34], [CW - 504, CH - 34 - 5 * 68, CW - 34, CH - 34]);
  setWorld(); drawClouds(t, avoid, boxes); setScreen();
  // faces first (persist for the whole film with their own phase), then tags, callouts and event chips on top
  const faces = [];
  for (const o of vis) {
    const gi = E.stops.indexOf(o.s);
    let face;
    if (o.mi.micro) { // small sticker face that stays after the callout closes
      const [t0] = calloutLife(o.s);
      face = t >= t0 ? drawFace({ ...o.s, sticker: true }, o.c, t, gi, Math.max(o.f.R, 16)) : null;
    } else face = drawFace(o.s, o.c, t, gi);
    faces.push({ o, face, gi });
  }
  const tagA = 1 - outroK(t); ctx.save(); ctx.globalAlpha = tagA;
  for (const { o, face, gi } of faces) {
    if (tagA <= 0.01) break;
    let anchor = face;
    if (o.mi.micro) { const co = drawCallout(o.s, t, gi); if (co) anchor = { x: co.box[2], y: co.y - 60, r: 20, callout: co.box }; }
    else if (face) { const ta = tagAlpha(o.s, t); if (ta > 0.01) { ctx.save(); ctx.globalAlpha = ta; nameTag({ ...o.s, activate: -10 }, face.x, face.y, face.r, t); ctx.restore(); } }
    if (anchor) drawEvents(o.s, t, anchor);
  }
  ctx.restore();
  drawOutroWorld(t);
  drawIntro(t);
  drawHUD(t, st);
  drawOutroUI(t, st);
  ctx.restore();
}
window.drawFrame = drawFrame; window.stateAt = stateAt; window.camAt = camAt; window.shotAt = shotAt; window.CLOUDS = CLOUDS;

// ---------- technical check frames (not part of the story; picked from the data by the build script) ----------
function drawStatusSheet() {
  CAM = CAMS.ov; drawMap(5, { visited: [], current: null }); setScreen();
  ctx.fillStyle = 'rgba(10,30,45,.45)'; ctx.fillRect(0, 0, CW, CH);
  const keys = Object.keys(E.statuses), w = 560, h = 120;
  keys.forEach((k, i) => {
    const S = E.statuses[k], x = 120 + (i % 3) * 580, y = 300 + Math.floor(i / 3) * 170;
    glossyPanel(x, y, w, h, 26, '#ffffff', '#e4ebf2', 'rgba(20,35,50,.45)');
    statusIcon(k, x + 66, y + h / 2, 42);
    outlined(S.label, x + 124, y + 58, '400 40px "Lilita One"', S.dark, null, 0);
    outlined(S.rule || '', x + 124, y + 94, '800 19px Nunito', '#55626f', null, 0);
  });
  outlined('STATUS SET', CW / 2, 220, '400 64px "Lilita One"', '#ffffff', '#123047', 10, 'center');
}
function drawTech(kind) {
  if (!CAMS) buildCams();

  const tc = E.techChecks.find(x => x.kind === kind); const c = C[tc.id];
  const stop = { ...tc, activate: -10, colorAt: null, tint: tc.tint || 0 };
  const t = 5;
  const span = tc.span ? (() => { const l = c.label; return [l[0] - tc.span[0] / 2, l[1] - tc.span[1] / 2, l[0] + tc.span[0] / 2, l[1] + tc.span[1] / 2]; })() : null;
  CAM = tc.micro ? (() => { const b = c.bbox; return countryCam(tc.id, { box: [b[0] - 330, b[1] - 230, b[2] + 120, b[3] + 120] }); })()

  const st = { visited: [], current: stop };
  drawMap(t, st, [stop]);
  setScreen();
  if (tc.micro) {
    // magnified callout of the real contour, face inside the enlarged land, flag, marker and dashed leader
    const [mx, my] = w2s((c.bbox[0] + c.bbox[2]) / 2, (c.bbox[1] + c.bbox[3]) / 2);
    const bx = mx - 800, by = my - 450, bw = 580, bh = 430;
    ctx.save(); ctx.setLineDash([10, 8]); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(bx + bw, by + bh / 2); ctx.stroke(); ctx.restore();
    ctx.beginPath(); ctx.arc(mx, my, 12, 0, 7); ctx.fillStyle = '#ff3b4e'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
    glossyPanel(bx, by, bw, bh, 26, '#f5fbff', '#dbe9f2', 'rgba(20,35,50,.55)');
    ctx.save(); rr(bx + 8, by + 8, bw - 16, bh - 16, 20); ctx.clip();
    ctx.fillStyle = '#7fdde3'; ctx.fillRect(bx, by, bw, bh);
    const b = c.nearBox, s = Math.min((bw - 60) / (b[2] - b[0]), (bh - 100) / (b[3] - b[1]));
    const ox = bx + bw / 2 - (b[0] + b[2]) / 2 * s, oy = by + 22 + (bh - 100) / 2 - (b[1] + b[3]) / 2 * s;
    ctx.setTransform(s, 0, 0, s, ox, oy);
    ctx.save(); ctx.translate(0, 5 / s); ctx.fillStyle = '#7c8f3a'; ctx.fill(c.path); ctx.restore();
    const saveCam = CAM; CAM = { x: (CW / 2 - ox) / s, y: (CH / 2 - oy) / s, z: s };
    flagFill(c, tc.flag, null, t); statusTint(c, { ...stop, tint: 0 }, t);
    ctx.strokeStyle = '#1f3519'; ctx.lineWidth = 2 / s; ctx.stroke(c.path);
    setScreen();
    const fp = w2s(c.label[0], c.label[1]);
    drawFace({ ...stop, faceBacking: true }, c, t, 1, Math.min(c.label[2] * s * .95, 64), { x: fp[0], y: fp[1] });
    CAM = saveCam; ctx.restore();
    const fw = drawFlag(tc.flag, bx + 22, by + bh - 58, 38, 2);
    outlined(tc.name.toUpperCase(), bx + 34 + fw, by + bh - 28, '900 24px Nunito', '#18222d', null, 0);
  } else {
    const face = drawFace(stop, c, t, 2); if (face) { nameTag({ ...stop, activate: -10 }, face.x, face.y, face.r, t); if (tc.events) for (const ev of tc.events) drawEvent(stop, { ...ev, t: 0 }, t, face); }
  }
  setScreen();
  if (tc.note) { ctx.font = '900 26px Nunito'; const nw = ctx.measureText(tc.note).width + 40; glossyPanel(CW / 2 - nw / 2, 30, nw, 50, 25, '#fff8c4', '#ffe98a', 'rgba(90,60,0,.6)'); outlined(tc.note, CW / 2, 64, '900 26px Nunito', '#4a3600', null, 0, 'center'); }

}
window.drawTech = drawTech;

// ---------- preview player (global timeline; optional voice track) ----------
let playing = false, t0 = 0, tNow = 0, sound = false;
const seek = document.getElementById('seek'), timeEl = document.getElementById('time'), playBtn = document.getElementById('play');
const audio = E.audio ? new Audio(E.audio.preview || E.audio.file) : null;
function show(t) { tNow = t; drawFrame(t); seek.value = t; timeEl.textContent = t.toFixed(2) + ' / ' + E.duration.toFixed(2) + ' s'; }
function loop(ts) { if (!playing) return; const t = (ts - t0) / 1000; if (t >= E.duration) { stop(); show(E.duration); return; } show(t); requestAnimationFrame(loop); }
function start(from) { playing = true; playBtn.textContent = 'Pause'; tNow = from; if (audio && sound) { audio.currentTime = E.audioOffset ? from + E.audioOffset : from; audio.play().catch(() => {}); } requestAnimationFrame(ts => { t0 = ts - from * 1000; loop(ts); }); }
function stop() { playing = false; playBtn.textContent = 'Play'; if (audio) audio.pause(); }
READY.then(() => {
  seek.max = E.duration;
  if (RENDER) return;
  show(0);
  playBtn.onclick = () => playing ? stop() : start(tNow >= E.duration ? 0 : tNow);
  document.getElementById('replay').onclick = () => { stop(); start(0); };
  document.getElementById('snd').onclick = e => { sound = !sound; e.target.textContent = 'Sound: ' + (sound ? 'on' : 'off'); if (playing) { stop(); start(tNow); } };
  seek.oninput = () => { stop(); show(+seek.value); };
  for (const k of ['statuses', ...(E.techChecks || []).map(x => x.kind)]) { const o = document.createElement('option'); o.value = k; o.textContent = 'Check: ' + k; document.getElementById('tech').appendChild(o); }
  document.getElementById('tech').onchange = e => { stop(); if (e.target.value) drawTech(e.target.value); else show(tNow); };
}).catch(e => { document.getElementById('err').textContent = String(e); window.JS_ERRORS = [String(e)]; });
